# Copy to search_profile.yaml and edit. The real file is gitignored.
# This drives a real run: title keywords, location eligibility and public ATS boards.

keywords:
  - software engineer
  - software engineering intern
  - sde intern
  - web development intern
  - frontend engineer
  - backend engineer
  - full stack engineer
  - ai/ml intern
  - machine learning engineer
  - ai engineer
  - data engineer
  - graduate software engineer
  - fresher software engineer
  - entry level software engineer

# Known non-India countries are excluded even for remote jobs. Unknown-country
# remote jobs are excluded by default; explicitly worldwide roles are retained.
location:
  remote_ok: false
  allowed_countries: [India]

# Intern/graduate titles are junior-ranked. Omit this ceiling to disable it.
max_seniority: senior
# Leave unset unless you want hard experience requirements filtered.
# experience_years: 0

# Public search sources; edit queries/boards for your target companies.
sources:
  - { ats: sr-search, board: "software engineer intern" }
  - { ats: sr-search, board: "graduate software engineer" }
  - { ats: remotive, board: "software developer" }
  - { ats: remoteok, board: software-engineer }
  # Replace with companies that hire in India; company board IDs are examples.
  - { ats: greenhouse, board: example-company }

# Describe your real skills and experience; do not add personal facts to this
# committed template. The real candidate profile belongs in a gitignored file.
candidate_summary: >
  Seeking internship, fresher, graduate, and entry-level software engineering,
  web development, and AI/ML opportunities in Bengaluru or remote roles open to
  candidates in India. Edit this summary to describe your actual skills.
